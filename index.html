<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renaissance Operator Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f0e1; --card:#fffdf4; --ink:#161513;
  --red:#e3372e; --blue:#2456c4; --yellow:#f2b60f; --green:#1d8a4a;
  --soft:#6f6a5e; --hair:#e4dcc6;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{background:var(--paper); color:var(--ink); font-family:"Space Grotesk", system-ui, sans-serif; font-size:15.5px; line-height:1.55; min-height:100vh;}
.wrap{max-width:900px; margin:0 auto; padding:18px 14px 90px;}
header{padding:8px 2px 4px;}
.logo{font-family:"Archivo Black", sans-serif; font-size:34px; line-height:1.02; letter-spacing:-.5px;}
.shapes{display:flex; gap:8px; margin:10px 0 8px; align-items:flex-end;}
.shapes i{display:block; width:18px; height:18px;}
.shapes .s1{background:var(--red);}
.shapes .s2{background:var(--blue); border-radius:50%;}
.shapes .s3{width:0;height:0;background:none;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:18px solid var(--yellow);}
.shapes .s4{background:var(--green);}
.shapes .s5{background:var(--ink); border-radius:50% 50% 0 0;}
.sub{font-size:12.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--soft);}
.key{font-size:12px; color:var(--soft); margin-top:6px;}
.key b{font-weight:700;}
.key .kb{color:var(--blue);} .key .kr{color:var(--red);} .key .ky{background:var(--yellow); color:var(--ink); padding:0 4px;} .key .kg{color:var(--green);}
nav{display:flex; gap:18px; flex-wrap:wrap; margin:16px 0 20px; border-bottom:2px solid var(--ink); padding-bottom:0;}
nav button{font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:14px; background:none; color:var(--ink); border:0; border-bottom:4px solid transparent; padding:6px 2px 8px; cursor:pointer; margin-bottom:-2px;}
nav button.on{border-bottom-color:var(--blue); color:var(--blue);}
nav button:focus-visible{outline:3px solid var(--blue); outline-offset:2px;}
.panel{border:2px solid var(--ink); background:var(--card); padding:16px 18px; margin-bottom:20px; box-shadow:4px 4px 0 var(--ink);}
.ph{font-family:"Archivo Black",sans-serif; font-size:17px; letter-spacing:.02em; text-transform:uppercase; border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:12px;}
.kv{display:flex; flex-wrap:wrap; gap:12px 28px;}
.kv b{display:block; font-family:"Archivo Black",sans-serif; font-size:26px; line-height:1;}
.kv span{font-size:11px; color:var(--soft); text-transform:uppercase; letter-spacing:.1em;}
.bar{height:12px; border:2px solid var(--ink); margin-top:12px; position:relative; background:var(--card);}
.bar i{position:absolute; inset:0; width:0%; background:var(--green); transition:width .4s;}
.todaydate{font-family:"Archivo Black",sans-serif; font-size:26px; line-height:1.1;}
.phase{color:var(--soft); font-size:13px; margin:4px 0 10px;}
.plan li{list-style:none; padding:5px 0; font-size:14.5px; border-bottom:1px solid var(--hair);}
.plan li:last-child{border-bottom:0;}
.plan .cc2{font-weight:700;}
.plan .life{color:var(--soft);}
.next-card{border:1.5px solid var(--ink); background:var(--card); padding:10px 12px; margin-bottom:8px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.next-card.od{border-color:var(--red); border-width:2px;}
.next-card .cc{font-weight:700; min-width:84px;}
.next-card .duechip{font-size:12px; color:var(--blue); font-weight:700; white-space:nowrap;}
.next-card.od .duechip{color:var(--red);}
.next-card button{margin-left:auto; background:var(--blue); border:0; color:#fff; font-family:inherit; font-weight:700; font-size:13px; padding:7px 15px; cursor:pointer;}
.next-card button:active{transform:translate(1px,1px);}
.term-h{display:flex; align-items:baseline; gap:12px; margin:26px 0 10px; flex-wrap:wrap;}
.term-h h2{font-family:"Archivo Black",sans-serif; font-size:21px;}
.term-h small{color:var(--soft); font-size:12.5px;}
.course{border:1.5px solid var(--ink); background:var(--card); margin-bottom:10px;}
.course>button.head{width:100%; text-align:left; background:none; border:0; color:inherit; font-family:inherit; padding:13px 15px; cursor:pointer; display:flex; gap:10px; align-items:center; font-size:15.5px; flex-wrap:wrap;}
.course>button.head:focus-visible{outline:3px solid var(--blue); outline-offset:-3px;}
.code{font-weight:700; min-width:80px;}
.cred{margin-left:auto; color:var(--soft); font-size:12px; white-space:nowrap;}
.grade-chip{font-family:"Archivo Black",sans-serif; font-size:13px; padding:3px 9px; border:1.5px solid var(--ink); background:var(--card); min-width:34px; text-align:center; white-space:nowrap;}
.grade-chip.pass{background:var(--green); border-color:var(--green); color:#fff;}
.body{display:none; padding:2px 15px 15px; border-top:1.5px dashed var(--ink);}
.course.open .body{display:block;}
.spine{border-left:4px solid var(--ink); padding:9px 12px; margin:12px 0; background:#f1ead6; font-size:14px;}
.spine b{font-weight:700;}
.meets{border-left:4px solid var(--ink); padding:9px 12px; margin:12px 0; background:#f1ead6; font-size:13.5px;}
.meets b{font-weight:700;}
.free{color:#fff; background:var(--green); font-size:10px; padding:1px 6px; margin-left:6px; font-weight:700; letter-spacing:.05em;}
.cat{font-size:13.5px; color:var(--soft); margin:10px 0 2px;}
details.grading{margin:8px 0 12px; font-size:13.5px;}
details.grading summary{cursor:pointer; color:var(--blue); font-weight:700; list-style:none;}
details.grading summary::before{content:"▸ ";}
details[open].grading summary::before{content:"▾ ";}
details.grading .gtxt{padding:8px 0 0 14px;}
.week{border:1.5px solid var(--ink); margin-bottom:8px; background:var(--card);}
.week.od{border-left:6px solid var(--red);}
.week.now{border-left:6px solid var(--blue);}
.week>button.wh{width:100%; text-align:left; background:none; border:0; color:inherit; font-family:inherit; font-size:14px; font-weight:500; padding:11px 13px; cursor:pointer; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.week>button.wh:focus-visible{outline:3px solid var(--blue); outline-offset:-3px;}
.week .wdates{color:var(--soft); font-size:12px;}
.week .dots{margin-left:auto; letter-spacing:3px; font-size:11px; color:#cfc7ae;}
.week .dots .on{color:var(--green);}
.wk-body{display:none; padding:2px 13px 12px; border-top:1.5px dashed var(--ink);}
.week.open .wk-body{display:block;}
.task{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--hair); align-items:flex-start;}
.task:last-child{border-bottom:0;}
.task .chk{width:20px; height:20px; accent-color:#1d8a4a; cursor:pointer; margin-top:1px; flex:none;}
.task .tx{flex:1; font-size:14px;}
.task .meta{display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex:none;}
.task .tag{color:#bcb49c; font-size:10px; white-space:nowrap; letter-spacing:.03em;}
.hwflag{color:var(--ink); background:var(--yellow); font-weight:700; font-size:10.5px; white-space:nowrap; padding:1px 6px;}
.due{font-size:11px; color:var(--soft); white-space:nowrap;}
.due.od{color:var(--red); font-weight:700;}
.due.now{color:var(--blue); font-weight:700;}
.qwrap{flex:1;}
.qrow{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:6px;}
.qrow input[type=number]{width:70px; background:#fff; border:1.5px solid var(--ink); color:var(--ink); font-family:inherit; padding:5px 7px; font-size:14px;}
.qrow button, .genbtn, .pl-btn{background:var(--card); border:1.5px solid var(--ink); color:var(--ink); font-family:inherit; font-weight:700; font-size:13px; padding:5px 11px; cursor:pointer;}
.qrow button:hover, .genbtn:hover, .pl-btn:hover{background:var(--ink); color:var(--card);}
.qrow button:active, .genbtn:active, .pl-btn:active{transform:translate(1px,1px);}
button[data-log]{background:var(--blue); border-color:var(--blue); color:#fff;}
button[data-log]:hover{background:var(--ink); border-color:var(--ink);}
.stamp{font-weight:700; font-size:13.5px; margin-left:4px;}
.stamp.p{color:var(--green);} .stamp.r{color:var(--red);} .stamp.d{color:var(--soft);}
.gen{display:none; margin-top:8px;}
.gen.show{display:block;}
.gen textarea{width:100%; height:150px; background:#fff; color:var(--ink); border:1.5px solid var(--ink); font-family:"Space Grotesk",sans-serif; font-size:12.5px; padding:8px;}
.plc{border:2px solid var(--ink); background:var(--card); padding:12px 14px; margin:14px 0;}
.plc h3{font-family:"Archivo Black",sans-serif; font-size:16px; margin-bottom:6px;}
.plc .dom{font-family:"Archivo Black",sans-serif; font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; border-bottom:2px solid var(--ink); display:inline-block; padding-bottom:2px; margin:14px 0 4px;}
.plc .pq{padding:8px 0; border-bottom:1px solid var(--hair); font-size:14px;}
.plc .pq pre{white-space:pre-wrap; background:#fff; border:1.5px solid var(--ink); padding:6px 8px; margin-top:5px; font-size:13px; font-family:ui-monospace,Menlo,monospace;}
.plc .pq .ans{color:var(--green); font-weight:700; margin-top:4px;}
.plc .pq label{display:flex; gap:8px; align-items:center; margin-top:5px; color:var(--soft); font-size:13px; cursor:pointer;}
.plc .pq input{accent-color:#1d8a4a; width:18px; height:18px;}
.plc .result{border:1.5px solid var(--ink); background:#fff; padding:10px 12px; margin-top:12px;}
.plc .result b{font-family:"Archivo Black",sans-serif;}
.plc .weak{color:var(--red); font-weight:700;}
.gb{border:2px solid var(--ink); background:var(--card); padding:12px 14px; margin:14px 0;}
.gb h3{font-family:"Archivo Black",sans-serif; font-size:15px; text-transform:uppercase; border-bottom:2px solid var(--ink); padding-bottom:4px; margin-bottom:8px;}
.gb table{width:100%; border-collapse:collapse; font-size:13.5px;}
.gb th{color:var(--soft); font-size:11px; text-transform:uppercase; letter-spacing:.08em; text-align:left; padding:6px 4px; border-bottom:2px solid var(--ink);}
.gb td{padding:8px 4px; border-bottom:1px solid var(--hair); vertical-align:top;}
.gb .pts{font-family:"Archivo Black",sans-serif; font-size:15px; white-space:nowrap;}
.gb .total{font-family:"Archivo Black",sans-serif; font-size:20px;}
.syl{border:2px solid var(--ink); background:var(--card); padding:14px 16px; margin:12px 0;}
.syl h3{font-family:"Archivo Black",sans-serif; font-size:19px;}
.syl h4{font-family:"Archivo Black",sans-serif; font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; margin:14px 0 5px; border-bottom:2px solid var(--ink); display:inline-block; padding-bottom:2px;}
.syl table{width:100%; border-collapse:collapse; font-size:13px;}
.syl td,.syl th{padding:5px 4px; border-bottom:1px solid var(--hair); text-align:left;}
.syl .cal li{list-style:none; padding:3px 0; font-size:13px; border-bottom:1px solid #eee6d0;}
.syl .hwmark{background:var(--yellow); color:var(--ink); font-weight:700; padding:0 4px;}
.tr-table{width:100%; border-collapse:collapse; font-size:14px;}
.tr-table th{color:var(--soft); font-size:11px; text-transform:uppercase; letter-spacing:.08em; text-align:left; padding:7px 6px; border-bottom:2px solid var(--ink);}
.tr-table td{padding:8px 6px; border-bottom:1px solid var(--hair); vertical-align:top;}
.gpa-line{font-family:"Archivo Black",sans-serif; font-size:20px; margin-top:12px;}
#eventlog{border:1.5px solid var(--ink); background:#fff; padding:10px 12px; height:150px; overflow-y:auto; font-size:12.5px; color:var(--soft);}
#eventlog .t{color:#bcb49c; margin-right:8px;}
#eventlog .hot{color:var(--ink); font-weight:500;} #eventlog .warn{color:var(--red); font-weight:700;}
.note{font-size:13px; color:var(--soft); margin-top:8px;}
.repair-item{color:var(--ink); font-size:14px; padding:6px 0; border-bottom:1px solid var(--hair); display:flex; gap:8px; align-items:center;}
.repair-item::before{content:""; width:10px; height:10px; background:var(--red); flex:none;}
.flash{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--card); border:2px solid var(--ink); color:var(--ink); padding:9px 18px; font-family:"Archivo Black",sans-serif; font-size:15px; z-index:120; display:none; box-shadow:4px 4px 0 var(--ink); white-space:nowrap;}
.lib-term{font-family:"Archivo Black",sans-serif; font-size:16px; margin:18px 0 6px;}
.lib li{list-style:none; padding:6px 0; font-size:14px; border-bottom:1px solid var(--hair);}
.carver{border:2px solid var(--ink); background:var(--card); padding:12px 14px; margin-top:16px; font-size:14px;}
.carver b{font-weight:700;}
.sched-day{border:1.5px solid var(--ink); background:var(--card); padding:10px 12px; margin-bottom:8px;}
.sched-day h4{font-family:"Archivo Black",sans-serif; font-size:14px; text-transform:uppercase; letter-spacing:.05em; border-bottom:1.5px solid var(--ink); padding-bottom:3px; margin-bottom:5px;}
.sched-day .blk{display:flex; gap:10px; padding:5px 0; border-bottom:1px solid #eee6d0; font-size:13.5px; align-items:baseline; flex-wrap:wrap;}
.sched-day .blk:last-child{border-bottom:0;}
.sched-day .bt{color:var(--soft); min-width:92px; white-space:nowrap; font-size:12.5px;}
.sched-day .bc{font-weight:700; min-width:76px;}
.sched-day .bp{color:var(--soft);}
@media (prefers-reduced-motion:reduce){ .bar i{transition:none;} }
@media (max-width:640px){ .kv b{font-size:22px;} .logo{font-size:27px;} }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo">Renaissance Operator Institute</div>
  <div class="shapes" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i><i class="s5"></i></div>
  <div class="sub">Ricky · Honors Foundation Year · Fall 2026 · "Do what is right in front of you."</div>
  <div class="key">Color means one thing everywhere: <b class="kb">blue = now</b> · <b class="kr">red = late or needs repair</b> · <b class="ky">yellow = counts for points</b> · <b class="kg">green = done</b></div>
</header>

<nav>
  <button data-v="dash" class="on">Today</button>
  <button data-v="sched">Schedule</button>
  <button data-v="courses">Courses</button>
  <button data-v="transcript">Transcript</button>
  <button data-v="library">Library</button>
</nav>

<main id="view"></main>
</div>
<div class="flash" id="flash"></div>

<script>
/* ===== Safe storage: persists on GitHub Pages or as a local file; memory-only in sandboxed previews ===== */
const mem = {};
const store = {
  get(k,d){ try{const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return (k in mem)?mem[k]:d;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){mem[k]=v;} }
};
const PASS = 80;

/* ================= THE ACADEMIC CALENDAR =================
   Matriculation: Jul 26 – Aug 8, 2026.  Term I: Aug 9 (Sun) – Oct 17 (Sat), ten weeks.
   Written work due Saturdays. Quizzes in Friday's quiz section. Midterms Fri of Week 5 (Sep 11).
   Finals on fixed days in the Examination Week, Oct 18–24. */
const T1START = new Date(2026,7,9);
const MATRIC  = new Date(2026,6,26);
const EXAM_E  = new Date(2026,9,24);
function strip(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function wkDate(i,off){ return new Date(2026,7,9+i*7+off); }
function fdate(d){ return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}); }
function fshort(d){ return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function todayD(){ return strip(new Date()); }
function curWeek(){ const dd=Math.floor((todayD()-strip(T1START))/864e5); return dd<0? -1 : Math.floor(dd/7); }
function phase(){
  const t=todayD();
  if(t<strip(MATRIC)) return {p:"before", label:"Matriculation begins "+fdate(MATRIC)+". Term I begins "+fdate(T1START)+"."};
  if(t<strip(T1START)) return {p:"matric", label:"Matriculation · "+fshort(MATRIC)+" – Aug 8 · Term I begins "+fdate(T1START)};
  const w=curWeek();
  if(w<=9) return {p:"term", w, label:"Term I · Week "+(w+1)+" of 10 · "+fshort(wkDate(w,0))+" – "+fshort(wkDate(w,6))};
  if(t<=strip(EXAM_E)) return {p:"exam", label:"Examination and Repair Week · Oct 18 – 24 · see the finals schedule"};
  return {p:"post", label:"Term I complete · Term II begins Oct 25"};
}
function dueForWeekTask(wi,isQuiz){ return wkDate(wi, isQuiz?5:6); }
function dueForItem(n){ return n===0? new Date(2026,7,8) : wkDate(n-1,6); }
function dueChip(d,done){
  if(done) return `<span class="due">done</span>`;
  const t=todayD();
  if(t>strip(d)) return `<span class="due od">overdue · was ${fdate(d)}</span>`;
  const w=curWeek();
  const inThisWeek = w>=0 && strip(d)<=strip(wkDate(Math.min(w,9),6));
  return `<span class="due ${inThisWeek?'now':''}">due ${fdate(d)}</span>`;
}
function recChip(kind){ return `<span class="due">${kind==="w"?"every week":kind==="m"?"every month":"standing"}</span>`; }

/* ===== FINALS SCHEDULE — fixed days, like a registrar ===== */
const FINALS = {
 "MAT 101": new Date(2026,9,19), "CSC 101": new Date(2026,9,20),
 "MUS 101": new Date(2026,9,21), "CMP 101": new Date(2026,9,21),
 "CRE 101": new Date(2026,9,22), "HPS 101": new Date(2026,9,22),
 "AIM 101": new Date(2026,9,23), "RDG 101": new Date(2026,9,23),
};
const MIDTERM_DATE = wkDate(4,5); /* Fri Sep 11 */

/* ===== THE CLASS SCHEDULE — single source of truth.
   Real college model: short meetings proportional to credits, ~15 in-class
   hours a week, Mon–Fri afternoons only, placed OUTSIDE MNQ market hours
   (RTH 6:30a–1:00p PT). Mornings and weekends carry no classes.
   Everything not listed here is homework — you place it yourself.
   Times are defaults: edit this block to move any class. ===== */
const GRID = [
 [], /* Sunday — no classes */
 [ {t:"1:30–2:30",c:"MAT 101",k:"Lecture"},
   {t:"2:45–3:45",c:"MUS 101",k:"Class"},
   {t:"4:00–5:00",c:"AIM 101",k:"Lab"} ],
 [ {t:"1:30–3:00",c:"CSC 101",k:"Lecture"},
   {t:"3:15–4:15",c:"CRE 101",k:"Practicum"} ],
 [ {t:"1:30–2:30",c:"MAT 101",k:"Problem session"},
   {t:"2:45–3:45",c:"MUS 101",k:"Class"},
   {t:"4:00–5:00",c:"HPS 101",k:"Lab"} ],
 [ {t:"1:30–3:00",c:"CSC 101",k:"Section"},
   {t:"3:15–4:15",c:"CRE 101",k:"Practicum"},
   {t:"4:30–5:15",c:"RDG 101",k:"Lab"} ],
 [ {t:"1:30–2:30",c:"MAT 101",k:"Quiz section"},
   {t:"2:45–4:15",c:"CMP 101",k:"Studio"},
   {t:"4:30–5:00",c:"ALL",k:"Tutorial"} ],
 [], /* Saturday — no classes; written work due by end of day */
];
const DAYNAMES=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function meetsLine(code){
  const parts=[];
  GRID.forEach((day,di)=>{ day.forEach(b=>{ if(b.c===code) parts.push(DAYNAMES[di].slice(0,3)+" "+b.t+" ("+b.k+")"); }); });
  return parts.join(" · ");
}
/* What each meeting kind is FOR — the standing definition shown in Schedule */
const KINDDESC = {
 "MAT 101|Lecture":"work the week's reading","MAT 101|Problem session":"the week's problem set","MAT 101|Quiz section":"the weekly quiz, cumulative",
 "CSC 101|Lecture":"the week's CS50P lecture","CSC 101|Section":"the week's problem set + build",
 "MUS 101|Class":"theory chapter + written work (keyboard practice is homework)",
 "CMP 101|Studio":"the current miniature",
 "CRE 101|Practicum":"offers, outreach, publishing",
 "HPS 101|Lab":"the week's logs and protocols",
 "AIM 101|Lab":"prompt library + verification work",
 "RDG 101|Lab":"the book brief + Anki deck",
 "ALL|Tutorial":"defend one piece of work — the ten questions",
};
/* What each meeting covers THIS WEEK — resolved from the course data, so the
   schedule always points at real coursework. */
function agendaFor(code,kind){
  const w=curWeek(); if(w<0||w>9) return "";
  if(code==="ALL") return "Defend one piece of this week's work";
  if(code==="MAT 101"){ const d=MATW[w];
    if(kind==="Lecture") return "Read "+d.sec+" — "+d.t;
    if(kind==="Problem session") return "Problem set: "+d.sec;
    return d.noquiz? "Review week — rework the error log" : (d.mid? "MIDTERM — 40 questions, 60 minutes" : "Weekly quiz — 20 questions, cumulative"); }
  if(code==="CSC 101"){ const d=CSCW[w];
    return kind==="Lecture"? d.lec : d.pset+" + build: "+d.b; }
  if(code==="MUS 101"){ const d=MUSW[w]; return d.t+" — "+d.w; }
  const c=TERMS[0].courses.find(x=>x.code===code); if(!c||!c.items) return "";
  const idx=c.items.findIndex((it,i)=> typeof it[2]==="number" && !S.checks[code+"#c"+i]);
  if(idx>=0) return "Next: "+c.items[idx][1];
  const fall={"CRE 101":"Weekly rhythm — ten contacts, one publish","HPS 101":"Review the week's logs","AIM 101":"Prompt library upkeep","RDG 101":"This week's book brief"};
  return fall[code]||"";

return "Act as my strict closed-book examiner for OpenStax Algebra and Trigonometry 2e.\n"+
"Write a 40-question MIDTERM covering sections 1.1 through 2.4: 24 computation, 10 applied word problems (futures-trading contexts welcome), 6 explain-why.\n"+
"Questions only, numbered. 60-minute clock from when I say begin. When I say done: strict score out of 100, full worked answer key, and a repair list by section.";

"Write a 25-question MIDTERM: 10 predict-the-output, 8 write-short-code-on-paper, 7 explain-why. Questions only, numbered.\n"+
"60-minute clock from when I say begin. When I say done: strict score out of 100, full answer key with working code, and a repair list by lecture.";
}
function musMidPrompt(){
return "Act as my music theory and ear-training examiner for a cumulative MIDTERM over: notation, rhythm, major scales, intervals, and triads.\n"+
"Give a 20-item test: written spelling and identification in text, plus keyboard tasks you dictate (I play and report). One item at a time.\n"+
"When I say done: strict score out of 100, corrections, and a repair list by topic.";
}
function cscCheckPrompt(build){

}
function cscFinalPrompt(){
return "I am going to walk you through my Trade Analyzer v1 (CS50P final project).\n"+
"Act as a project examiner: have me explain every function unaided, then stress-test me — malformed CSVs, division-by-zero cases, commission handling, why each metric formula is right.\n"+

}

"Then score the defense 0–100 with reasons.";

function juryGeneric(kind){
return "Act as a strict but fair review panel for my "+kind+".\n"+

}

function logEv(msg,cls){ const t=new Date().toTimeString().slice(0,8); S.log.unshift({t,msg,cls}); if(S.log.length>90) S.log.length=90; }

function rank(){ let r=RANKS[0][1]; for(const [x,t] of RANKS) if(S.xp>=x) r=t; return r; }

/* ================= TASKS ================= */
let PROMPTS=[];

function isHW(c, code){
  if(c.kind==="mat"||c.kind==="csc"||c.kind==="mus"){
    const i=HW_WEEKS.indexOf(parseInt((code.match(/-W(\d\d)-/)||[])[1],10));
    if(i>=0 && (code.endsWith(c.kind==="mus"?"-W01":"-PS01"))) return i+1;
    return 0;
  }
  const g=GB_ITEMS[c.code]; if(!g) return 0;
  const i=g.hw.indexOf(code); return i>=0? i+1 : 0;
}

function courseWeeks(c){
  const CO=c.code.replace(/\s/g,""); const W=n=>CO+"-W"+String(n).padStart(2,"0");
  const weeks=[];
  if(c.kind==="mat"){
    MATW.forEach((w,i)=>{ const n=i+1; const tasks=[
      {type:"chk", code:W(n)+"-R01", tx:"Read "+w.sec+" and drop the key ideas into Anki.", due:dueForWeekTask(i,false)},
      {type:"chk", code:W(n)+"-PS01", tx:"Do "+w.ps+". Full attempt before checking any answers — they are in your book.", due:dueForWeekTask(i,false)},
      {type:"chk", code:W(n)+"-EX01", tx:"Write 300–500 words: "+w.ex, due:dueForWeekTask(i,false)},
    ];
    if(!w.noquiz) tasks.push({type:"quiz", code:W(n)+(w.mid?"-MID":"-Q01"), tx:(w.mid?"Midterm — Friday, "+fshort(MIDTERM_DATE)+". 40 questions, 60 minutes, everything so far. Worth 20 gradebook points.":"Quiz — Friday's quiz section. 20 questions, 30 minutes, everything so far."), qkey:c.code+"#q"+n, due:dueForWeekTask(i,true), p:P(w.mid?matMidPrompt():matQuizPrompt(n,w.end,w.sec,w.t))});
    weeks.push({title:"Week "+n, sub:w.t, wi:i, tasks});});
  } else if(c.kind==="csc"){
    CSCW.forEach((w,i)=>{ const n=i+1; weeks.push({title:"Week "+n, sub:w.lec.replace(/Lecture \d+ — /,""), wi:i, tasks:[
      {type:"chk", code:W(n)+"-R01", tx:"Watch "+w.lec+" and note the key moves into Anki.", due:dueForWeekTask(i,false)},
      {type:"chk", code:W(n)+"-PS01", tx:"Do "+w.pset+" — the real one on Harvard's site. Full attempt before any help.", due:dueForWeekTask(i,false)},
      {type:"chk", code:W(n)+"-B01", tx:"Build "+w.b+".", due:dueForWeekTask(i,false)},
      {type:"chk", code:W(n)+"-EX01", tx:"Code journal, 150 words: what broke, why, and the fix.", due:dueForWeekTask(i,false)},
      {type:"quiz", code:W(n)+"-Q01", tx:"Concept check — Friday. Explain your build line by line, examined.", qkey:c.code+"#q"+n, due:dueForWeekTask(i,true), p:P(cscCheckPrompt(w.b))},
    ]});});
  } else if(c.kind==="mus"){
    MUSW.forEach((w,i)=>{ const n=i+1; const tasks=[
      {type:"chk", code:W(n)+"-R01", tx:"Read the Open Music Theory chapter: "+w.t+".", due:dueForWeekTask(i,false)},
      {type:"chk", code:W(n)+"-W01", tx:"Do "+w.w+".", due:dueForWeekTask(i,false)},
      {type:"chk", code:W(n)+"-KB01", tx:"Keyboard: "+w.kb+".", due:dueForWeekTask(i,false)},
    ];
    if(w.q) tasks.push({type:"quiz", code:W(n)+"-Q01", tx:"Test — Friday. "+w.q+".", qkey:c.code+"#q"+n, due:dueForWeekTask(i,true), p:P(musTestPrompt(w.t))});
    weeks.push({title:"Week "+n, sub:w.t, wi:i, tasks});});
  } else if(c.items){
    weeks.push({title:"The work", sub:"", wi:null, tasks:c.items.map(it=>{
      const d=it[2];
      return (typeof d==="number") ? {type:"chk", code:it[0], tx:it[1], due:dueForItem(d)} : {type:"chk", code:it[0], tx:it[1], rec:d};
    })});
  }
  return weeks;
}
function flatChecks(c){ const out=[]; courseWeeks(c).forEach(w=>w.tasks.forEach(t=>{ if(t.type==="chk") out.push(t); })); return out; }

/* ================= GRADEBOOK — 5 HW × 6 + midterm 20 + final 50 = 100 ================= */
function gbSpec(c){
  if(c.kind==="lab"||c.kind==="future") return null;
  const CO=c.code.replace(/\s/g,"");
  let hw=[];
  if(c.kind==="mat"||c.kind==="csc"||c.kind==="mus"){
    hw=HW_WEEKS.map((w,i)=>({n:i+1, ref:CO+"-W0"+w+(c.kind==="mus"?"-W01":"-PS01"), label:"Week "+w+" "+(c.kind==="mus"?"written worksheet":"problem set")}));
  } else {
    const g=GB_ITEMS[c.code];
    hw=g.hw.map((ref,i)=>{ const it=(c.items||[]).find(x=>x[0]===ref); return {n:i+1, ref, label: it? it[1] : ref}; });
  }
  let mid;
  if(c.kind==="mat") mid={key:c.code+"#q5", label:"Midterm exam — the Week 5 exam row, one shared score", date:MIDTERM_DATE, shared:true};
  else if(c.kind==="csc") mid={key:"m:"+c.code, label:"Midterm exam — Lectures 0–4, written, 60 minutes", date:MIDTERM_DATE, prompt:cscMidPrompt()};
  else if(c.kind==="mus") mid={key:"m:"+c.code, label:"Midterm — cumulative test, notation through triads", date:MIDTERM_DATE, prompt:musMidPrompt()};
  else mid={key:"m:"+c.code, label:GB_ITEMS[c.code].mid, date:MIDTERM_DATE, prompt:essayGraderPrompt(c.code, GB_ITEMS[c.code].mid), essay:true};
  return {hw, mid, finKey:"f:"+c.code, finDate:FINALS[c.code]};
}
function gbTotal(c){
  const g=gbSpec(c); if(!g) return null;
  let t=0;
  g.hw.forEach((h,i)=>{ const v=S.scores["hw:"+c.code+":"+(i+1)]; if(v!=null) t+=v*0.06; });
  const m=S.scores[g.mid.key]; if(m!=null) t+=m*0.20;
  const f=S.scores[g.finKey]; if(f!=null) t+=f*0.50;
  return t;
}

/* ================= PROGRESS + COMPLETION ================= */
function courseCalc(c){
  const chks=flatChecks(c); let done=0; chks.forEach((t,i)=>{ if(S.checks[c.code+"#c"+i]) done++; });
  const workPct=chks.length? done/chks.length*100:0;
  if(c.kind==="lab") return {done, total:chks.length, workPct, letter: workPct>=100?"P":"…"};
  return {done, total:chks.length, workPct};
}
function courseComplete(c,k){
  if(c.kind==="lab") return k.workPct>=100;
  const g=gbSpec(c); if(!g) return false;
  const defOK = (S.scores["d:"+c.code]??-1) >= PASS;
  const finOK = S.scores[g.finKey]!=null;
  return k.done===k.total && k.total>0 && finOK && defOK && (gbTotal(c)>=PASS);
}
function repairList(){
  const out=[];
  for(const k in S.scores){ const v=S.scores[k]; if(v==null||v>=PASS) continue;
    let label;
    if(k.startsWith("diag:")) label=k.slice(5)+" placement — follow your repair plan, then move on";
    else if(k.startsWith("f:")) label=k.slice(2)+" final — rework it, then retest";
    else if(k.startsWith("d:")) label=k.slice(2)+" oral defense — re-defend when ready";
    else if(k.startsWith("m:")) label=k.slice(2)+" midterm — rework the misses, retest fresh";
    else if(k.startsWith("hw:")){ const p=k.split(":"); label=p[1]+" HW "+p[2]+" — rework and regrade"; }
    else { const m=k.split("#q"); label=m[0]+" week "+m[1]+" quiz — rework the misses, retest fresh"; }
    out.push({label,v});
  }
  return out;
}

/* ================= DUE — authority from real dates ================= */
function dueList(){
  const out=[]; const t=todayD(); const w=curWeek(); const weekEnd = w>=0? strip(wkDate(Math.min(w,9),6)) : strip(new Date(2026,7,8));
  const t1=TERMS[0];
  t1.courses.forEach(c=>{
    if(c.placement && !plcState(c.code).logged){
      out.push({cc:c.code, tx:"Take the placement exam — "+PLC[c.code].n+" real questions, sitting in the course.", id:c.code.replace(/\s/g,""), due:new Date(2026,7,8), prio:1, od:t>strip(new Date(2026,7,8))});
    }
    const chks=flatChecks(c);
    chks.forEach((task,i)=>{
      if(S.checks[c.code+"#c"+i]) return;
      if(task.rec) return;
      if(!task.due) return;
      const d=strip(task.due);
      if(d<=weekEnd) out.push({cc:c.code, tx:task.tx, id:c.code.replace(/\s/g,""), due:task.due, prio:(c.code==="STB 090"||c.code==="ORI 000")?0:2, od:d<t});
    });
    courseWeeks(c).forEach(wk=>wk.tasks.forEach(task=>{
      if(task.type!=="quiz") return;
      if(S.scores[task.qkey]!=null) return;
      const d=strip(task.due);
      if(d<=weekEnd) out.push({cc:c.code, tx:task.tx, id:c.code.replace(/\s/g,""), due:task.due, prio:2, od:d<t});
    }));
    const g=gbSpec(c);
    if(g && !g.mid.shared && S.scores[g.mid.key]==null){
      const d=strip(g.mid.date);
      if(d<=weekEnd) out.push({cc:c.code, tx:"Midterm ("+ (g.mid.essay?"essay":"exam") +") — 20 gradebook points.", id:c.code.replace(/\s/g,""), due:g.mid.date, prio:2, od:d<t});
    }
    if(g && curWeek()>=10 && t<=strip(EXAM_E) && S.scores[g.finKey]==null){
      out.push({cc:c.code, tx:(c.finlabel||"Final exam")+" — 50 gradebook points.", id:c.code.replace(/\s/g,""), due:g.finDate, prio:2, od:t>strip(g.finDate)});
    }
  });
  out.sort((a,b)=> (b.od?1:0)-(a.od?1:0) || a.due-b.due || a.prio-b.prio);
  return out;
}

}

/* ---- placement engine ---- */
function placementHTML(code){
  const spec=PLC[code]; const p=plcState(code);
  let h=`<div class="plc"><h3>${spec.title} — the real thing, right here</h3>
  <div class="note" style="margin-top:0">${spec.n} questions, ${spec.time}, closed book. Due by ${fdate(new Date(2026,7,8))}. Diagnostic — it cannot hurt you, it only places you. ${spec.intro}</div>`;
  let lastD=-1;
  spec.qs.forEach((it,i)=>{
    if(it.d!==lastD){ h+=`<div class="dom">${spec.doms[it.d].name}</div>`; lastD=it.d; }
    h+=`<div class="pq"><div>${i+1}. ${it.q}</div>`;
    if(it.code) h+=`<pre>${it.code}</pre>`;
    if(p.revealed){ h+=`<div class="ans">Answer: ${it.a}</div><label><input type="checkbox" data-plc="${code}|${i}" ${p.right[i]?"checked":""}> I got this one right</label>`; }
    h+=`</div>`;
  });
  if(!p.revealed){ h+=`<div class="qrow" style="margin-top:12px"><button class="pl-btn" data-plreveal="${code}">I am done — show the answers</button></div>`; }
  else {
    const res=placementScore(code);
    h+=`<div class="result"><b>${res.right} / ${spec.n} (${res.pct}%)</b><br>`;
    if(res.weak.length){ h+=`<span class="weak">Repair plan before Week 1:</span><br>`+res.weak.map(d=>"· "+spec.doms[d].name+" → "+spec.doms[d].repair).join("<br>"); }
    else h+=spec.pass;
    h+=`</div>`;
    if(!p.logged) h+=`<div class="qrow" style="margin-top:10px"><button class="pl-btn" data-pllog="${code}">Log my placement</button></div>`;
    else h+=`<div class="note">Placement logged. It is diagnostic — it never touches your grade.</div>`;
  }
  h+=`</div>`;
  return h;
}
function placementScore(code){
  const spec=PLC[code]; const p=plcState(code);
  let right=0; const perD=spec.doms.map(()=>({r:0,n:0}));
  spec.qs.forEach((it,i)=>{ perD[it.d].n++; if(p.right[i]){right++; perD[it.d].r++;} });
  const weak=[]; perD.forEach((d,i)=>{ if(d.r/d.n<0.8) weak.push(i); });
  return {right, pct:Math.round(right/spec.n*100), weak};
}

function courseBody(c,k,future,begins){
  let h=`<div class="cat">${c.desc}</div><div class="cat">Prereq: ${c.prereq}</div>`+spineHTML(c)+ (future? "" : meetsHTML(c));
  if(future){ h+=`<div class="note">Begins ${begins}. Buy the books only when the term begins — Constitution 3. Everything is open to read and plan against now.</div>`; return h; }
  const id=c.code.replace(/\s/g,"");
  if(c.kind!=="lab"){
    h+=`<div class="qrow" style="margin:8px 0"><button class="genbtn" data-syl="${id}">${openSyl[id]?"Close":"Open"} syllabus</button></div>`;
    if(openSyl[id]) h+=syllabusHTML(c);
    h+=gradingDetails();
  }
  if(c.daily) h+=`<div class="note" style="margin-bottom:8px">${c.daily}</div>`;
  if(c.placement) h+=placementHTML(c.code);
  const weeks=courseWeeks(c); const cw=curWeek();
  let ci=0;
  weeks.forEach((w,wi)=>{
    const wid=id+"-wk"+wi;
    const total=w.tasks.length;
    let done=0;
    const inner=w.tasks.map(t=>{
      if(t.type==="chk"){ const key=c.code+"#c"+ci; ci++; const ck=!!S.checks[key]; if(ck)done++;
        const chip = t.rec? recChip(t.rec) : dueChip(t.due, ck);
        const hwN=isHW(c, t.code);
        return `<div class="task"><input type="checkbox" class="chk" data-k="${key}" data-code="${t.code}" ${ck?"checked":""} aria-label="done"><div class="tx">${t.tx}</div><div class="meta"><span class="tag">${t.code}</span>${hwN?`<span class="hwflag">HW${hwN} · 6 pts</span>`:""}${chip}</div></div>`; }
      const sc=S.scores[t.qkey]; if(sc!=null&&sc>=PASS)done++;
      return `<div class="task"><div style="width:20px;flex:none"></div><div class="qwrap"><div class="tx">${t.tx}</div>${quizCell(t.qkey,sc)}${genBlock(t.p, t.code.includes("MID")?"midterm":"quiz")}</div><div class="meta"><span class="tag">${t.code}</span>${dueChip(t.due, sc!=null&&sc>=PASS)}</div></div>`;
    }).join("");
    const dots=Array.from({length:total},(_,i)=>`<span class="${i<done?'on':''}">●</span>`).join("");
    const dates = w.wi==null? "" : `<span class="wdates">${fshort(wkDate(w.wi,0))} – ${fshort(wkDate(w.wi,6))}</span>`;
    const isNow = w.wi!=null && w.wi===cw;
    const isOd = w.wi!=null && cw>w.wi && done<total;
    const userOpen = openWeeks[wid];
    const open = userOpen===true || (userOpen===undefined && (w.wi==null ? true : (cw<0? w.wi===0 : isNow)));
    h+=`<div class="week ${open?'open':''} ${isNow?'now':''} ${isOd?'od':''}"><button class="wh" data-wk="${wid}">${w.title}${w.sub?" · "+w.sub:""} ${dates}<span class="dots">${dots}</span></button><div class="wk-body">${inner}</div></div>`;
  });
  if(c.kind!=="lab"){
    const finlabel=c.finlabel||"Final exam";
    const fp = c.finPrompt? c.finPrompt : (c.kind==="mat"? matFinalPrompt() : c.kind==="csc"? cscFinalPrompt() : musJuryPrompt());
    const g=gbSpec(c);
    const examChip = `<span class="due ${curWeek()>=10?'now':''}">${fdate(g.finDate)}</span>`;
    h+=`<div class="week open"><button class="wh" style="cursor:default">Examination <span class="wdates">${fdate(g.finDate)} · defense follows the final</span></button><div class="wk-body" style="display:block">
    <div class="task"><div style="width:20px;flex:none"></div><div class="qwrap"><div class="tx"><b>${finlabel}</b> — closed book, everything. 50 gradebook points.</div>${quizCell("f:"+c.code,S.scores["f:"+c.code])}${genBlock(P(fp),"exam")}</div><div class="meta">${examChip}</div></div>
    <div class="task"><div style="width:20px;flex:none"></div><div class="qwrap"><div class="tx"><b>Oral defense</b> — the ten questions, out loud, unaided. Required to pass.</div>${quizCell("d:"+c.code,S.scores["d:"+c.code])}${genBlock(P(defensePrompt(c.code+" — "+c.title)),"defense")}</div><div class="meta">${examChip}</div></div>
    </div></div>`;
    h+=gradebookHTML(c);
  }
  if(c.note) h+=`<div class="note">${c.note}</div>`;
  return h;
}

function renderCourses(){

    html+=`<div class="term-h"><h2>${t.name}</h2><small>${t.dates}</small></div>`;

      if(!t.begins){
        if(c.kind==="lab") chip=`<span class="grade-chip ${k.letter==="P"?"pass":""}">${k.letter}</span>`;
        else { const tot=gbTotal(c); const done=courseComplete(c,k); chip=`<span class="grade-chip ${done?"pass":""}">${done?"P":Math.round(tot)+" pts"}</span>`; }

      html+=`<div class="course ${openCourses[id]?'open':''}"><button class="head" data-c="${id}"><span class="code">${c.code}</span><span>${c.title}</span><span class="cred">${c.cr} cr</span>${chip}</button><div class="body">${openCourses[id]?courseBody(c,k,!!t.begins,t.begins):""}</div></div>`;

function bindInputs(){
  view.querySelectorAll("button[data-syl]").forEach(b=>{ b.onclick=()=>{ const id=b.dataset.syl; openSyl[id]=!openSyl[id]; store.set("roi5_syl",openSyl); render(); }; });
  view.querySelectorAll("button.wh[data-wk]").forEach(b=>{ b.onclick=()=>{ const id=b.dataset.wk; const el=b.parentElement; const now=!el.classList.contains("open"); el.classList.toggle("open"); openWeeks[id]=now; store.set("roi5_wk",openWeeks); }; });
  view.querySelectorAll(".chk").forEach(ch=>{ ch.onchange=()=>{ S.checks[ch.dataset.k]=ch.checked;
    if(ch.checked){ award(10); touchStreak(); logEv((ch.dataset.code||"item")+" done · +10 xp","hot"); flash("Done ✓ +10 xp"); }
    save(); render(); }; });
  view.querySelectorAll("button[data-log]").forEach(b=>{ b.onclick=()=>{ const key=b.dataset.log, diag=b.dataset.diag==="1";
    const inp=view.querySelector(`input[data-q="${CSS.escape(key)}"]`); const v=Math.max(0,Math.min(100,Number(inp.value)));
    if(inp.value===""||isNaN(v)) return;
    S.scores[key]=v; award(v); touchStreak();
    if(diag){ logEv(key+" diagnostic "+v,"hot"); flash("Placement logged · "+v); }
    else if(v>=PASS){ logEv(key+" scored "+v+" · cleared","hot"); flash("Cleared ✓ "+v+" · +"+v+" xp"); }
    else { logEv(key+" scored "+v+" · to Repairs","warn"); flash("To Repairs · "+v+" — patch it, retest"); }
    save(); render(); }; });
  view.querySelectorAll("button[data-gen]").forEach(b=>{ b.onclick=()=>{ document.getElementById("gen-"+b.dataset.gen).classList.toggle("show"); }; });
  view.querySelectorAll("button[data-copy]").forEach(b=>{ b.onclick=()=>{ const t=PROMPTS[b.dataset.copy];
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>flash("Copied — paste to your examiner")); }
    else { const ta=document.querySelector("#gen-"+b.dataset.copy+" textarea"); ta.select(); try{document.execCommand("copy"); flash("Copied — paste to your examiner");}catch(e){} } }; });
  view.querySelectorAll("input[data-plc]").forEach(ch=>{ ch.onchange=()=>{ const [code,idx]=ch.dataset.plc.split("|"); plcState(code).right[idx]=ch.checked; save(); }; });
  view.querySelectorAll("button[data-plreveal]").forEach(b=>{ b.onclick=()=>{ const code=b.dataset.plreveal; plcState(code).revealed=true; save(); logEv(PLC[code].title+" answers revealed — self-check honestly","hot"); render(); }; });
  view.querySelectorAll("button[data-pllog]").forEach(b=>{ b.onclick=()=>{ const code=b.dataset.pllog; const res=placementScore(code); S.scores["diag:"+code]=res.pct; plcState(code).logged=true; award(50); touchStreak();
    logEv(PLC[code].title+" logged · "+res.pct+"%"+(res.weak.length?" · repair plan issued":" · clean sweep"),"hot"); flash("Placement logged · "+res.pct+"%"); save(); render(); }; });
}

    h+=`</div>`;
  });
  h+=`<div class="sched-day"><h4>Saturday + Sunday</h4><div class="blk"><span class="bt">—</span><span class="bc"></span><span class="bp">No classes. Written work due Saturday; otherwise the weekend is yours.</span></div></div>
  </div>
  <div class="panel"><div class="ph">Exam dates — fixed, visible from day one</div>
  <table class="tr-table"><tr><th>Course</th><th>Midterm</th><th>Final</th></tr>
  ${TERMS[0].courses.filter(c=>c.kind!=="lab").map(c=>`<tr><td><b>${c.code}</b></td><td>${fdate(MIDTERM_DATE)}</td><td>${fdate(FINALS[c.code])} · ${c.finlabel||"Final exam"} + defense</td></tr>`).join("")}
  </table>
  <div class="note">Sun Oct 18 · reading day. Sat Oct 24 · repairs and makeups. Every date is known from today — front-load homework or cram before an exam; the dates never sneak up on you.</div></div>`;
  view.innerHTML=h;
}

function renderTranscript(){
  let rows="", credEarned=0;
  TERMS.forEach(t=>{
    rows+=`<tr><td colspan="4" style="font-family:'Archivo Black',sans-serif;font-size:15px;padding-top:14px">${t.name}</td></tr>`;
    t.courses.forEach(c=>{ const k=courseCalc(c); let g="—";
      if(!t.begins){
        if(c.kind==="lab") g=k.letter;
        else { const tot=gbTotal(c); g = courseComplete(c,k)? "P · gradebook "+letterOf(tot) : Math.round(tot)+"/100 pts · in progress"; }
        if(courseComplete(c,k)) credEarned+=c.cr;
      }
      rows+=`<tr><td><b>${c.code}</b></td><td>${c.title}</td><td>${c.cr}</td><td>${g}</td></tr>`; });
  });
  view.innerHTML=`<div class="panel"><div class="ph">Transcript</div>
  <table class="tr-table"><tr><th>Code</th><th>Course</th><th>Cr</th><th>Grade</th></tr>${rows}</table>
  <div class="gpa-line">Credits earned: ${credEarned}</div>
  <div class="note">Term I records Pass / No Pass — the MIT and Caltech first-year rule — with the A+–F letter kept in each course's 100-point gradebook. Pass = B− (80) plus the oral defense. Labs grade P on completion. Letters reach the transcript and GPA from Term II.</div></div>`;
}

function renderLibrary(){
  let h=`<div class="panel"><div class="ph">The library — every book, every term</div>
  <div class="note" style="margin:0 0 6px">Buy only when the term begins — Constitution 3. Everything marked FREE costs nothing: the entire quantitative spine is $0.</div>`;
  LIBRARY.forEach(sec=>{ h+=`<div class="lib-term">${sec.t}</div><ul class="lib">`;
    sec.items.forEach(([n,f])=>{ h+=`<li>${n}${f?'<span class="free">FREE</span>':''}</li>`; }); h+=`</ul>`; });
  h+=`<div class="carver"><b>The Carver sequence</b> — the applied quant spine, in reading order:<br>
  I · <b>Leveraged Trading</b> (Term II) — the Starter System, your first fully specified rules-based system.<br>
  II · <b>Systematic Trading</b> (Term III) — the full design framework, run through pysystemtrade, his own open-source engine.<br>
  III · <b>Advanced Futures Trading Strategies</b> (Term IV) — thirty-plus diversified futures systems. The "multiple profitable trading bots" book.<br>
  Paired with Aronson (Term III) and López de Prado (Term IV) so every edge is proven real before it is trusted.</div></div>`;
  view.innerHTML=h;
}

function render(){
  PROMPTS=[];
  if(cur==="dash") renderDash();
  else if(cur==="sched") renderSchedule();
  else if(cur==="courses") renderCourses();
  else if(cur==="transcript") renderTranscript();
  else renderLibrary();
}
document.querySelectorAll("nav button").forEach(b=>{ b.onclick=()=>{ document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); cur=b.dataset.v; render(); }; });
logEv("Session start · "+todayISO());
render();
</script>
</body>
</html>
